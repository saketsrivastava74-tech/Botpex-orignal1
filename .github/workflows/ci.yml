name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Build (dependency order)
        run: npm run build
      - name: Test
        run: npx vitest run
      - name: Benchmarks (smoke)
        run: npx tsx benchmarks/run.ts --smoke
